[metadata]
name = fortloop
version = 0.0.1
author = Matthias Rüegg
author_email = matthias.ruegg@epfl.ch
description = FORTloop data processing
long_description = file: README.md
long_description_content_type = text/markdown
url = https://c4science.ch/source/fortloop/
project_urls =
    Bug Tracker = https://c4science.ch/source/fortloop/
classifiers =
    Programming Language :: Python :: 3
    License :: OSI Approved :: MIT License
    Operating System :: OS Independent

[options]
package_dir =
    = src
packages = find:
python_requires = >=3.6
install_requires=
    numpy
    scipy
    pandas
    matplotlib
    networkx
    formicidae-tracker-hermes>=0.5.4
    
[options.packages.find]
where = src
